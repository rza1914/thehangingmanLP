services:
  - type: web
    name: the-hanging-man-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHAT_ID
        sync: false
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5173"
      - key: ENVIRONMENT
        value: "production"